name: Publish Homebrew packages

on:
  workflow_call:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_GITHUB_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-homebrew:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi

      - uses: actions/checkout@v7.0.1
        with:
          ref: main

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.1"
          cache: true

      - name: Verify release and render packages
        id: packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          work_dir="$(mktemp -d)"
          release_json="$work_dir/release.json"
          checksums="$work_dir/checksums.txt"
          package_dir="$work_dir/homebrew"

          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >"$release_json"
          jq -e --arg tag "$TAG" \
            '.tag_name == $tag and .draft == false and .prerelease == false' \
            "$release_json" >/dev/null

          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern checksums.txt \
            --output "$checksums"

          go run ./cmd/render-homebrew-formula \
            -version "${TAG#v}" \
            -checksums "$checksums" \
            -format formula \
            -output "$package_dir/Formula/go-argo-mcp.rb"

          go run ./cmd/render-homebrew-formula \
            -version "${TAG#v}" \
            -checksums "$checksums" \
            -format cask \
            -output "$package_dir/Casks/go-argo-mcp.rb"

          echo "directory=$package_dir" >>"$GITHUB_OUTPUT"

      - name: Publish and verify Homebrew packages
        env:
          PACKAGE_DIR: ${{ steps.packages.outputs.directory }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          response="$(mktemp)"
          payload="$(mktemp)"
          stored_package="$(mktemp)"
          trap 'rm -f "$response" "$payload" "$stored_package"' EXIT
          headers=(
            --header "Accept: application/vnd.github+json"
            --header "Authorization: Bearer $HOMEBREW_TAP_GITHUB_TOKEN"
            --header "X-GitHub-Api-Version: 2022-11-28"
          )

          for relative_path in Formula/go-argo-mcp.rb Casks/go-argo-mcp.rb; do
            package_path="$PACKAGE_DIR/$relative_path"
            endpoint="https://api.github.com/repos/CaliLuke/homebrew-tap/contents/$relative_path"

            status="$(curl --silent --show-error \
              --output "$response" \
              --write-out '%{http_code}' \
              "${headers[@]}" \
              "$endpoint")"
            case "$status" in
              200)
                current_sha="$(jq -er '.sha' "$response")"
                ;;
              404)
                current_sha=""
                ;;
              *)
                jq -r '.message // "GitHub API request failed"' "$response" >&2
                echo "Reading the current package at $relative_path failed with HTTP $status" >&2
                exit 1
                ;;
            esac

            content="$(base64 -w 0 "$package_path")"
            jq -n \
              --arg message "Update go-argo-mcp to $TAG" \
              --arg content "$content" \
              --arg sha "$current_sha" \
              '$ARGS.named | if .sha == "" then del(.sha) else . end' >"$payload"

            status="$(curl --silent --show-error \
              --request PUT \
              --output "$response" \
              --write-out '%{http_code}' \
              "${headers[@]}" \
              --header "Content-Type: application/json" \
              --data-binary "@$payload" \
              "$endpoint")"
            if [[ "$status" != "200" && "$status" != "201" ]]; then
              jq -r '.message // "GitHub API request failed"' "$response" >&2
              echo "Publishing the package at $relative_path failed with HTTP $status" >&2
              exit 1
            fi

            status="$(curl --silent --show-error \
              --output "$response" \
              --write-out '%{http_code}' \
              "${headers[@]}" \
              "$endpoint")"
            if [[ "$status" != "200" ]]; then
              jq -r '.message // "GitHub API request failed"' "$response" >&2
              echo "Reading the published package at $relative_path failed with HTTP $status" >&2
              exit 1
            fi
            jq -er '.content' "$response" | tr -d '\n' | base64 -d >"$stored_package"
            cmp "$package_path" "$stored_package"
          done
