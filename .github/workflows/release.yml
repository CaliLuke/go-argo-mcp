name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.1"
          cache: true
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false
      - name: Install quality tools
        run: |
          go install github.com/CaliLuke/loom/cmd/loom@v1.9.0
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          go install github.com/mibk/dupl@v1.1.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install golang.org/x/tools/cmd/deadcode@v0.50.0
          go install golang.org/x/tools/cmd/goimports@v0.50.0
          uv tool install prek==0.2.2
      - name: Verify generated code
        run: |
          make generate
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard -- gen internal/argoapi/models)"
      - name: Run quality gates
        run: |
          actionlint
          prek run --all-files
      - name: Release binaries
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes=docs/releases/${{ github.ref_name }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-homebrew:
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/publish-homebrew.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
